name: Tests

on:
  push:
  pull_request:

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"
      - name: Install application and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run core and Qt-safe tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Run Qt isolation tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest test.test_channel_delay_skew_plugin -v
      - name: Compile package
        run: python -m compileall -q brighteyes_mcs scripts
