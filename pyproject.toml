[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "brighteyes-mcs"
dynamic = ["version"]
description = "Microscope control software for image-scanning microscopy"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
authors = [
    { name = "Mattia Donato", email = "mattia.donato@iit.it" },
    { name = "Istituto Italiano di Tecnologia" },
]
maintainers = [
    { name = "Mattia Donato", email = "mattia.donato@iit.it" },
]
keywords = [
    "microscopy",
    "image scanning microscopy",
    "fluorescence microscopy",
    "FPGA",
    "scientific imaging",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "brighteyes-mcs-cylibs>=1.0.0",
    "brighteyes-mcs-reader>=0.1.0",
    "pyqtdarktheme==0.1.7",
    "pyqtgraph==0.13.7",
    "PySide6>=6.10.1",
    "numpy",
    "nifpga",
    "h5py",
    "scipy",
    "imageio",
    "qtconsole",
    "psutil",
    "uvicorn",
    "nifpga-fast-fifo-recv>=0.102.0",
    "matplotlib",
    "fastapi",
    "requests",
    "python-multipart",
    "pywin32; platform_system == 'Windows'",
]

[project.optional-dependencies]
ao = ["pyserial"]
flim = ["brighteyes-flim>=0.9.4"]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "twine>=6",
]

[project.urls]
Homepage = "https://github.com/VicidominiLab/BrightEyes-MCS"
Documentation = "https://github.com/VicidominiLab/BrightEyes-MCS/wiki"
Repository = "https://github.com/VicidominiLab/BrightEyes-MCS.git"
Issues = "https://github.com/VicidominiLab/BrightEyes-MCS/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["brighteyes_mcs*"]

[tool.setuptools.dynamic]
version = { attr = "brighteyes_mcs.__version__" }

[tool.setuptools.package-data]
brighteyes_mcs = [
    "cfg/default.cfg",
    "cfg/plugins_cfg/*.cfg",
    "ui/qt/*.ui",
    "ui/qt/*.html",
    "images/*.png",
    "images/*.ico",
    "plugins/**/*.ui",
]

[tool.pytest.ini_options]
testpaths = ["test"]
norecursedirs = ["test/Sandbox"]
addopts = ["-m", "not qt_isolated"]
markers = [
    "integration: process or storage integration tests",
    "qt: tests requiring a Qt application",
    "hardware: tests requiring connected acquisition hardware",
    "qt_isolated: Qt tests run in a dedicated interpreter on Windows/Python 3.13",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["brighteyes_mcs/ui/qt/*_design.py", "brighteyes_mcs/plugins/**/*_design.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]
